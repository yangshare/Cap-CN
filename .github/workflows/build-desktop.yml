name: "Build Desktop (Windows)"

# 精简版桌面端构建：仅 Windows，不签名/不公证/不上架，
# 产物（未签名 NSIS 安装包 + 绿色版 zip）：
#   - 推送 v* tag（如 v0.5.2）时，构建后发布到该 tag 对应的 GitHub Release（附件挂在版本下面）；
#   - workflow_dispatch 手动触发时，只产 artifact，不发 Release。
# 后端默认连官方云 https://cap.so。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 同一 ref 的新构建会取消正在跑的旧构建，省额度
concurrency:
  group: build-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
  # CI-only profile 覆盖：通过环境变量覆盖 Cargo.toml 的 release profile，
  # 不改 Cargo.toml（本地构建保持原样），仅加速 CI 链接阶段。
  # - LTO: fat(true) → thin：链接时间大幅下降，体积/性能损失极小
  # - CODEGEN_UNITS: 1 → 16：串行 → 并行代码生成（runner 4 核）
  # - DEBUG: 完整 debuginfo → line-tables-only：保留 panic 行号（sentry 崩溃定位够用），
  #   去掉完整变量信息，减小体积、加快链接
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"

jobs:
  build:
    name: Build Windows Desktop
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write   # 发布 GitHub Release 需要写权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ env.RUST_TARGET_TRIPLE }}

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.RUST_TARGET_TRIPLE }}
          save-cache: "true"

      - name: Setup JS
        uses: ./.github/actions/setup-js

      # 只写构建必需的两个变量：
      # - VITE_ENVIRONMENT=production 影响前端构建模式
      # - RUST_TARGET_TRIPLE 给 setup.js / sidecar 构建用
      # 后端地址 VITE_SERVER_URL 不写，运行时默认 https://cap.so（官方云）
      - name: Create .env file
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "RUST_TARGET_TRIPLE=${{ env.RUST_TARGET_TRIPLE }}"
          } >> .env

      # cap-setup = node scripts/setup.js：下载 FFmpeg、生成 .cargo/config.toml（LIBCLANG_PATH 等）
      - name: Run cap-setup
        shell: bash
        run: pnpm -w cap-setup

      # 构建 cap-muxer / cap-exporter 等 Rust sidecar 二进制
      - name: Build desktop sidecar binaries
        shell: bash
        run: ./scripts/build-desktop-binaries.sh ${{ env.RUST_TARGET_TRIPLE }}

      # 构建 Tauri 桌面端并打包 NSIS 安装程序（未签名）。
      # 追加内联 config 覆盖：关闭 updater 产物（createUpdaterArtifacts=false）并清空 pubkey，
      # 否则 Tauri 检测到「有公钥无私钥」会报错退出（个人自用版本不需要官方自动更新）。
      - name: Build app
        working-directory: apps/desktop
        shell: bash
        run: |
          pnpm build:tauri --target ${{ env.RUST_TARGET_TRIPLE }} \
            --config src-tauri/tauri.prod.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"active":false,"pubkey":""}}}' \
            --bundles nsis
        env:
          # https://github.com/tauri-apps/tauri-action/issues/740
          CI: false

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: cap-windows-installer
          path: target/${{ env.RUST_TARGET_TRIPLE }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 打包「绿色版」zip：解压即用，无需安装。
      # 收集主程序 + 3 个 sidecar + FFmpeg DLL + resources（背景图/rive）。
      - name: Build portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triple = $env:RUST_TARGET_TRIPLE
          $staging = "cap-portable"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # 1) 主程序
          $mainExe = "target/$triple/release/Cap.exe"
          if (-not (Test-Path $mainExe)) { throw "主程序未找到: $mainExe" }
          Copy-Item $mainExe $staging
          Write-Host "已复制主程序: $mainExe"

          # 2) sidecar（从 binaries 目录复制并去掉 target triple 后缀，Tauri 运行时按此名查找）
          $binaries = "apps/desktop/src-tauri/binaries"
          foreach ($name in @("cap-muxer", "cap-exporter", "cap-cli")) {
            $src = Join-Path $binaries "$name-$triple.exe"
            if (-not (Test-Path $src)) { throw "sidecar 未找到: $src" }
            Copy-Item $src (Join-Path $staging "$name.exe")
          }
          Write-Host "已复制 sidecar: cap-muxer / cap-exporter / cap-cli"

          # 3) FFmpeg 运行时 DLL（cap-muxer/cap-exporter 动态链接，运行时需要）
          $dllSrc = "target/ffmpeg/bin"
          if (Test-Path $dllSrc) {
            Copy-Item "$dllSrc/*.dll" $staging -Force
            Write-Host "已复制 FFmpeg DLL: $((Get-ChildItem "$dllSrc/*.dll").Count) 个"
          } else {
            Write-Host "::warning::未找到 $dllSrc，绿色版可能因缺少 FFmpeg DLL 无法运行"
          }

          # 4) resources：背景图 + rive 动画（路径对应 tauri.conf.json 的 resources 配置）
          New-Item -ItemType Directory -Path "$staging/assets/backgrounds" -Force | Out-Null
          Copy-Item "apps/desktop/src-tauri/assets/backgrounds/*" "$staging/assets/backgrounds" -Recurse -Force
          New-Item -ItemType Directory -Path "$staging/assets/rive" -Force | Out-Null
          Copy-Item "apps/desktop/src/assets/rive/*.riv" "$staging/assets/rive" -Force
          Write-Host "已复制 resources（背景图 + rive）"

          # 5) 打包 zip（内容直接位于 zip 根，解压即见 Cap.exe）
          Compress-Archive -Path "$staging/*" -DestinationPath "cap-windows-portable.zip" -Force
          $count = (Get-ChildItem -Recurse $staging).Count
          $size = [math]::Round((Get-Item "cap-windows-portable.zip").Length / 1MB, 1)
          Write-Host "绿色版打包完成: cap-windows-portable.zip（$count 个文件, $size MB）"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v5
        with:
          name: cap-windows-portable
          path: cap-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

      # 仅在推送 v* tag 时触发：把构建产物作为附件发布到该 tag 对应的 GitHub Release。
      # generate_release_notes=true 会自动汇总自上一个 Release 以来的 commit（类似参考仓库的版本说明）。
      # tag 不存在时该 action 会自动按当前 ref 创建；tag 已存在则只追加/更新附件。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ env.RUST_TARGET_TRIPLE }}/release/bundle/nsis/*.exe
            cap-windows-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
